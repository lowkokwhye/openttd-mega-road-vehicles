name: Build Mega Road Vehicles NewGRF
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nml Pillow
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mega-road-vehicles-newgrf
          path: mega_road_vehicles_v0.1.0.grf
